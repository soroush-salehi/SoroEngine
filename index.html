<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroEngine</title><style>body{font:15px system-ui;background:#f5f7fb;color:#182238;max-width:980px;margin:35px auto;padding:0 20px}canvas{width:100%;background:#111b31;border-radius:14px}button{padding:10px 15px;border:0;border-radius:9px;background:#4169f5;color:white}</style><h1>◈ SoroEngine</h1><p>A tiny 2D canvas engine starter. Move with WASD or arrow keys.</p><canvas id="game" width="900" height="420"></canvas><p><button id="reset">Reset player</button> <span id="fps">FPS: —</span></p><script>class Input{constructor(){this.keys=new Set;onkeydown=e=>this.keys.add(e.key.toLowerCase());onkeyup=e=>this.keys.delete(e.key.toLowerCase())}down(...k){return k.some(x=>this.keys.has(x))}}class Player{constructor(){this.x=450;this.y=210;this.speed=230}update(dt,i){if(i.down('a','arrowleft'))this.x-=this.speed*dt;if(i.down('d','arrowright'))this.x+=this.speed*dt;if(i.down('w','arrowup'))this.y-=this.speed*dt;if(i.down('s','arrowdown'))this.y+=this.speed*dt;this.x=Math.max(15,Math.min(885,this.x));this.y=Math.max(15,Math.min(405,this.y))}}class Engine{constructor(c){this.c=c;this.ctx=c.getContext('2d');this.input=new Input;this.player=new Player;this.last=0;this.frames=0;this.fpsAt=0;requestAnimationFrame(t=>this.loop(t))}loop(t){let dt=Math.min((t-this.last)/1000||0,.05);this.last=t;this.player.update(dt,this.input);let c=this.ctx;c.clearRect(0,0,900,420);c.fillStyle='#172644';c.fillRect(0,0,900,420);c.strokeStyle='#2c3d5e';for(let x=0;x<900;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,420);c.stroke()}for(let y=0;y<420;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(900,y);c.stroke()}c.fillStyle='#91aaff';c.beginPath();c.arc(this.player.x,this.player.y,17,0,Math.PI*2);c.fill();this.frames++;if(t-this.fpsAt>1000){document.querySelector('#fps').textContent='FPS: '+this.frames;this.frames=0;this.fpsAt=t}requestAnimationFrame(t=>this.loop(t))}}let engine=new Engine(document.querySelector('#game'));document.querySelector('#reset').onclick=()=>engine.player=new Player</script>
