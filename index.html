<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroEngine</title><style>body{font:15px system-ui;background:#f5f7fb;color:#182238;max-width:980px;margin:35px auto;padding:0 20px}canvas{width:100%;background:#111b31;border-radius:14px}button{padding:10px 15px;border:0;border-radius:9px;background:#4169f5;color:white}</style>
<style id="soro-polish">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--accent:#ff9a58;--accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);--ink:#edf2ff;--muted:#98a6c2;--line:#27334d;--bg:#080d19;--card:#101a2b;--glow:color-mix(in srgb,var(--accent) 30%,transparent)}

p{line-height:1.7}button,.upload,.pill{transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease}

button.primary,.primary,.send,.upload{background:linear-gradient(115deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#263d78))!important;border-color:transparent!important;color:#fff!important}

.panel,.window,.msg,.bubble,.file,.person,.composer{box-shadow:0 14px 40px #0002!important}
.panel,.file,.window{background:linear-gradient(145deg,#121f34ee,#0e1728ee)!important;backdrop-filter:blur(14px)}
.muted,small,.eyebrow,footer{color:#94a3bf!important}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.brand{display:inline-flex;align-items:center;gap:9px}
.brand:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}

</style><script id="soro-motion">(()=>{const nodes='section,.panel,.stat,.tasks,.file,.window,.person,.hero,canvas'.split(',').flatMap(s=>[...document.querySelectorAll(s)]);const unique=[...new Set(nodes)].filter(n=>!n.closest('.side'));if(!('IntersectionObserver'in window)){unique.forEach(n=>n.classList.add('visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});unique.forEach(n=>{n.classList.add('reveal');io.observe(n)});})();</script><h1>◈ SoroEngine</h1><p>A tiny 2D canvas engine starter. Move with WASD or arrow keys.</p><canvas id="game" width="900" height="420"></canvas><p><button id="reset">Reset player</button> <span id="fps">FPS: —</span></p><script>class Input{constructor(){this.keys=new Set;onkeydown=e=>this.keys.add(e.key.toLowerCase());onkeyup=e=>this.keys.delete(e.key.toLowerCase())}down(...k){return k.some(x=>this.keys.has(x))}}class Player{constructor(){this.x=450;this.y=210;this.speed=230}update(dt,i){if(i.down('a','arrowleft'))this.x-=this.speed*dt;if(i.down('d','arrowright'))this.x+=this.speed*dt;if(i.down('w','arrowup'))this.y-=this.speed*dt;if(i.down('s','arrowdown'))this.y+=this.speed*dt;this.x=Math.max(15,Math.min(885,this.x));this.y=Math.max(15,Math.min(405,this.y))}}class Engine{constructor(c){this.c=c;this.ctx=c.getContext('2d');this.input=new Input;this.player=new Player;this.last=0;this.frames=0;this.fpsAt=0;requestAnimationFrame(t=>this.loop(t))}loop(t){let dt=Math.min((t-this.last)/1000||0,.05);this.last=t;this.player.update(dt,this.input);let c=this.ctx;c.clearRect(0,0,900,420);c.fillStyle='#172644';c.fillRect(0,0,900,420);c.strokeStyle='#2c3d5e';for(let x=0;x<900;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,420);c.stroke()}for(let y=0;y<420;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(900,y);c.stroke()}c.fillStyle='#91aaff';c.beginPath();c.arc(this.player.x,this.player.y,17,0,Math.PI*2);c.fill();this.frames++;if(t-this.fpsAt>1000){document.querySelector('#fps').textContent='FPS: '+this.frames;this.frames=0;this.fpsAt=t}requestAnimationFrame(t=>this.loop(t))}}let engine=new Engine(document.querySelector('#game'));document.querySelector('#reset').onclick=()=>engine.player=new Player</script>
